name: Monitor Demo Site

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - demo/**
      - render.yaml
      - scripts/check-demo-site.sh
      - .github/workflows/monitor-demo.yml

permissions:
  contents: read
  issues: write

jobs:
  smoke-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for deploy propagation
        if: github.event_name == 'push'
        run: sleep 240

      - name: Run production smoke check
        run: bash scripts/check-demo-site.sh

      - name: Close incident issue if recovered
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Demo site smoke check failing';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (!existing) {
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: `Smoke checks are passing again. Closing automatically from run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
            });

      - name: Create or update incident issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Demo site smoke check failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'Automated smoke check failed.',
              '',
              `- Workflow run: ${runUrl}`,
              `- Event: ${context.eventName}`,
              `- SHA: ${context.sha}`,
              `- UTC: ${new Date().toISOString()}`,
              '',
              'Please inspect the Render deploy status and logs.'
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
